<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archer 动态挠度与器材匹配</title>
    <link rel="stylesheet" href="src/styles.css?v=dynamic-1">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel setup-panel" hidden aria-hidden="true">
        <div class="panel-heading">
          <h1>实射落点记录</h1>
          <p>记录每支箭的落点、箭型和实验条件，为后续调弓分析提供数据。</p>
        </div>

        <form id="sessionForm" class="setup-grid">
          <label>
            弓型
            <select id="bowType">
              <option value="recurve">反曲</option>
              <option value="compound">复合</option>
              <option value="barebow">光弓</option>
              <option value="american_hunting">美猎</option>
              <option value="shelfless_traditional">无台传统弓</option>
            </select>
          </label>

          <label>
            距离
            <span class="inline-fields">
              <input id="distanceValue" type="number" min="1" step="1" value="18">
              <select id="distanceUnit">
                <option value="m">m</option>
                <option value="yd">yd</option>
              </select>
            </span>
          </label>

          <label>
            靶面直径 cm
            <input id="targetSizeCm" type="number" min="20" step="1" value="40">
          </label>

          <label>
            环数
            <input id="ringCount" type="number" min="5" max="12" step="1" value="10">
          </label>

          <label class="wide">
            本次目标
            <input id="goal" type="text" placeholder="例如：裸杆与羽箭中心偏差">
          </label>

          <label class="wide">
            器材状态
            <textarea id="setupNotes" rows="3" placeholder="磅数、箭长、箭重、按钮、弦距、nocking point 等"></textarea>
          </label>

          <label class="wide">
            环境备注
            <textarea id="conditionNotes" rows="2" placeholder="风、光线、温湿度、场地情况"></textarea>
          </label>
        </form>

        <div class="toolbar">
          <button id="newSessionButton" type="button">新建 session</button>
          <button id="saveButton" type="button">保存</button>
          <button id="undoButton" type="button">撤销上一箭</button>
          <button id="clearButton" type="button" class="danger">清空落点</button>
        </div>
      </section>

      <section class="workspace" hidden aria-hidden="true">
        <div class="panel target-panel">
          <div class="shot-controls">
            <label>
              箭型
              <select id="shotKind">
                <option value="fletched">羽箭</option>
                <option value="bareshaft">裸杆</option>
                <option value="test">测试箭</option>
              </select>
            </label>
            <label>
              单箭备注
              <input id="shotNote" type="text" placeholder="可选">
            </label>
          </div>

          <button id="target" class="target" type="button" aria-label="点击靶面记录落点">
            <span class="crosshair horizontal"></span>
            <span class="crosshair vertical"></span>
          </button>
        </div>

        <aside class="panel analysis-panel">
          <h2>统计</h2>
          <dl id="summary" class="summary"></dl>

          <div class="export-actions">
            <button id="jsonButton" type="button">导出 JSON</button>
            <button id="csvButton" type="button">导出 CSV</button>
          </div>

          <h2>落点列表</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>类型</th>
                  <th>环</th>
                  <th>X</th>
                  <th>Y</th>
                  <th>备注</th>
                </tr>
              </thead>
              <tbody id="shotTable"></tbody>
            </table>
          </div>
        </aside>
      </section>

      <section class="tool-grid">
        <section class="panel tool-panel two-stage-panel dynamic-spine-panel">
          <div class="panel-heading compact-heading">
            <h1>动态挠度与器材匹配</h1>
          </div>
          <form id="tuningForm" class="setup-grid tool-form">
            <label>弓型<select id="tuningBowType"><option value="olympic_recurve">竞技反曲</option><option value="barebow">光弓</option><option value="compound">复合弓</option><option value="american_hunting">美猎</option><option value="shelfless_traditional">无台传统弓</option></select></label>
            <label>箭杆材料<select id="tuningArrowMaterial"><option value="carbon">碳箭杆（空心）</option><option value="bamboo">拼竹箭杆（空心）</option><option value="wood">木箭杆（实心）</option></select></label>
            <label>实测满拉拉重 lb<input id="tuningDrawWeight" type="number" min="5" step="0.5" value="30"></label>
            <label>实测拉距 in<input id="tuningDrawLength" type="number" min="10" step="0.25" value="28"></label>
            <label>箭杆长 in<input id="tuningShaftLength" type="number" min="10" step="0.25" value="29"></label>
            <label>箭杆外径 mm<input id="tuningShaftDiameter" type="number" min="1" step="0.1" value="6"></label>
            <label>箭杆内径 mm（空心箭杆）<input id="tuningShaftInnerDiameter" type="number" min="0.1" step="0.1" value="4.2"></label>
            <label>弓把宽度 mm（无台填）<input id="tuningGripWidth" type="number" min="0" step="1" placeholder="自动取一半作中心线偏差"></label>
            <label>出箭点距中心线 mm<input id="tuningArrowPassOffset" type="number" min="0" step="0.5" placeholder="中心出箭填 0；无台弓需实测"></label>
            <label>裸箭重量 gr（不含箭头）<input id="tuningBareArrowWeight" type="number" min="1" step="1" value="170"></label>
            <label>箭头系统重量 gr<input id="tuningPointWeight" type="number" min="0" step="1" value="100"></label>
            <label>裸箭 ATA 静态挠度<input id="tuningAtaSpine" type="number" min="100" max="2000" step="1" value="700"></label>
          </form>
          <div class="toolbar"><button id="tuningButton" type="button">计算动态匹配</button></div>
          <p id="tuningError" class="form-error" role="alert"></p>
          <div class="dynamic-results">
            <div>
              <h3>当前动态挠度</h3>
              <dl id="currentDynamicSummary" class="summary tool-summary"></dl>
            </div>
            <div>
              <h3>推荐挠度区间</h3>
              <dl id="recommendedSpineSummary" class="summary tool-summary"></dl>
            </div>
            <div>
              <h3>固定箭杆后的挠度调整</h3>
              <dl id="fixedShaftSummary" class="summary tool-summary"></dl>
            </div>
          </div>
        </section>

        <section class="panel tool-panel converter-panel">
          <div class="panel-heading compact-heading">
            <h2>单位换算</h2>
          </div>
          <div class="converter-grid">
            <fieldset class="converter-group">
              <legend>质量</legend>
              <div class="converter-row">
                <label>克（g）<input id="gramsInput" type="number" step="any" value="100" inputmode="decimal"></label>
                <span class="converter-symbol" aria-hidden="true">⇄</span>
                <label>磅（lb）<input id="poundsInput" type="number" step="any" inputmode="decimal"></label>
              </div>
            </fieldset>
            <fieldset class="converter-group">
              <legend>长度</legend>
              <div class="converter-row">
                <label>英寸（in）<input id="inchesInput" type="number" step="any" value="1" inputmode="decimal"></label>
                <span class="converter-symbol" aria-hidden="true">⇄</span>
                <label>毫米（mm）<input id="millimetersInput" type="number" step="any" inputmode="decimal"></label>
              </div>
            </fieldset>
          </div>
        </section>
      </section>
    </main>

    <script src="src/model.dynamic.js?v=8"></script>
    <script src="src/storage.js"></script>
    <script src="src/app.dynamic.js?v=8"></script>
  </body>
</html>
