<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Archer 落点记录</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="panel setup-panel">
        <div class="panel-heading">
          <h1>实射落点记录</h1>
          <p>记录每支箭的落点、箭型和实验条件，为后续调弓分析提供数据。</p>
        </div>

        <form id="sessionForm" class="setup-grid">
          <label>
            弓型
            <select id="bowType">
              <option value="recurve">反曲</option>
              <option value="compound">复合</option>
              <option value="barebow">光弓</option>
              <option value="american_hunting">美猎</option>
              <option value="shelfless_traditional">无台传统弓</option>
            </select>
          </label>

          <label>
            距离
            <span class="inline-fields">
              <input id="distanceValue" type="number" min="1" step="1" value="18">
              <select id="distanceUnit">
                <option value="m">m</option>
                <option value="yd">yd</option>
              </select>
            </span>
          </label>

          <label>
            靶面直径 cm
            <input id="targetSizeCm" type="number" min="20" step="1" value="40">
          </label>

          <label>
            环数
            <input id="ringCount" type="number" min="5" max="12" step="1" value="10">
          </label>

          <label class="wide">
            本次目标
            <input id="goal" type="text" placeholder="例如：裸杆与羽箭中心偏差">
          </label>

          <label class="wide">
            器材状态
            <textarea id="setupNotes" rows="3" placeholder="磅数、箭长、箭重、按钮、弦距、nocking point 等"></textarea>
          </label>

          <label class="wide">
            环境备注
            <textarea id="conditionNotes" rows="2" placeholder="风、光线、温湿度、场地情况"></textarea>
          </label>
        </form>

        <div class="toolbar">
          <button id="newSessionButton" type="button">新建 session</button>
          <button id="saveButton" type="button">保存</button>
          <button id="undoButton" type="button">撤销上一箭</button>
          <button id="clearButton" type="button" class="danger">清空落点</button>
        </div>
      </section>

      <section class="workspace">
        <div class="panel target-panel">
          <div class="shot-controls">
            <label>
              箭型
              <select id="shotKind">
                <option value="fletched">Fletched 羽箭</option>
                <option value="bareshaft">Bare shaft 裸杆</option>
                <option value="test">Test 测试</option>
              </select>
            </label>
            <label>
              单箭备注
              <input id="shotNote" type="text" placeholder="可选">
            </label>
          </div>

          <button id="target" class="target" type="button" aria-label="点击靶面记录落点">
            <span class="crosshair horizontal"></span>
            <span class="crosshair vertical"></span>
          </button>
        </div>

        <aside class="panel analysis-panel">
          <h2>统计</h2>
          <dl id="summary" class="summary"></dl>

          <div class="export-actions">
            <button id="jsonButton" type="button">导出 JSON</button>
            <button id="csvButton" type="button">导出 CSV</button>
          </div>

          <h2>落点列表</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>类型</th>
                  <th>环</th>
                  <th>X</th>
                  <th>Y</th>
                  <th>备注</th>
                </tr>
              </thead>
              <tbody id="shotTable"></tbody>
            </table>
          </div>
        </aside>
      </section>

      <section class="tool-grid">
        <section class="panel tool-panel">
          <div class="panel-heading compact-heading">
            <h2>配件配置矩阵</h2>
          </div>
          <form id="equipmentForm" class="setup-grid tool-form">
            <label>
              弓型
              <select id="equipmentBowType">
                <option value="olympic_recurve">奥反</option>
                <option value="barebow">光弓</option>
                <option value="compound">复合</option>
                <option value="american_hunting">美猎</option>
                <option value="shelfless_traditional">无台传统弓</option>
              </select>
            </label>
            <label>
              拉重
              <input id="equipmentDrawWeights" type="text" value="26:40:2">
            </label>
            <label>
              AMO 拉距
              <input id="equipmentDrawLengths" type="text" value="26,28,30">
            </label>
            <label>
              箭材
              <select id="equipmentMaterial">
                <option value="carbon">碳箭</option>
                <option value="wood">木箭</option>
                <option value="bamboo">竹箭</option>
              </select>
            </label>
            <label>
              出箭点距中心线 mm
              <input id="equipmentArrowPassOffset" type="number" min="0" step="1" value="25">
            </label>
          </form>
          <div class="toolbar">
            <button id="equipmentButton" type="button">生成配置</button>
          </div>
          <p id="equipmentError" class="form-error" role="alert"></p>
          <div class="table-wrap tool-table">
            <table>
              <thead>
                <tr>
                  <th>弓型</th>
                  <th>拉重</th>
                  <th>拉距</th>
                  <th>箭长</th>
                  <th>箭头</th>
                  <th>碳箭 spine</th>
                  <th>成品箭重</th>
                  <th>最低箭重</th>
                  <th>Nocking</th>
                  <th>箭台/中心射出</th>
                </tr>
              </thead>
              <tbody id="equipmentTable"></tbody>
            </table>
          </div>
        </section>

        <section class="panel tool-panel">
          <div class="panel-heading compact-heading">
            <h2>Spine 推荐</h2>
          </div>
          <form id="spineForm" class="setup-grid tool-form">
            <label>
              弓型
              <select id="spineBowType">
                <option value="olympic_recurve">奥反</option>
                <option value="barebow">光弓</option>
                <option value="compound">复合</option>
                <option value="american_hunting">美猎</option>
                <option value="shelfless_traditional">无台传统弓</option>
              </select>
            </label>
            <label>
              拉重 lb
              <input id="spineDrawWeight" type="number" min="5" step="0.5" value="30">
            </label>
            <label>
              箭长 in
              <input id="spineArrowLength" type="number" min="10" step="0.25" value="30">
            </label>
            <label>
              箭头 gr
              <input id="spinePointWeight" type="number" min="20" max="1000" step="5" value="100">
            </label>
            <label>
              箭材
              <select id="spineMaterial">
                <option value="carbon">碳箭</option>
                <option value="wood">木箭</option>
                <option value="bamboo">竹箭</option>
              </select>
            </label>
            <label>
              Shaft GPI
              <input id="spineShaftGpi" type="number" min="0.1" max="100" step="0.1" value="8">
            </label>
            <label>
              Rear components gr
              <input id="spineRearComponentsWeight" type="number" min="0" max="1000" step="1" value="25">
            </label>
            <label>
              Static deflection in (optional)
              <input id="spineStaticDeflection" type="number" min="0.01" max="5" step="0.001" value="0.500">
            </label>
            <label>
              Bow maker minimum GPP (optional)
              <input id="spineManufacturerMinGpp" type="number" min="0.1" max="50" step="0.1" placeholder="Manual value">
            </label>
          </form>
          <div class="toolbar">
            <button id="spineButton" type="button">计算 spine</button>
          </div>
          <p id="spineError" class="form-error" role="alert"></p>
          <dl id="spineSummary" class="summary tool-summary"></dl>
        </section>
      </section>
    </main>

    <script src="src/model.js?v=368c67c"></script>
    <script src="src/storage.js"></script>
    <script src="src/app.js?v=368c67c"></script>
  </body>
</html>
